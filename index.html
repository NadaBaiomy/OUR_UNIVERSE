<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg:#070b16; --panel:#0e1626; --panel2:#141f36; --line:#233253; --line2:#2c3d63;
 --ink:#f2ead8; --muted:#8b98b8; --gold:#f0c274; --gold2:#e8a94f; --rose:#e88a8a; --teal:#7ec8c3;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Alexandria',sans-serif;overflow:hidden;
 background-image:radial-gradient(1.4px 1.4px at 12% 22%,rgba(255,255,255,.22),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.18),transparent),radial-gradient(1.6px 1.6px at 90% 74%,rgba(255,255,255,.14),transparent),radial-gradient(1px 1px at 35% 82%,rgba(255,255,255,.12),transparent),radial-gradient(1.2px 1.2px at 60% 45%,rgba(255,255,255,.1),transparent)}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;color:var(--ink)}
::selection{background:#f0c27455}
.en{font-family:'Marhey',cursive;letter-spacing:.14em}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:rgba(7,11,22,.72)}
@media(min-width:560px){body{overflow:auto;padding:26px 0}#app{height:min(880px,calc(100dvh - 52px));border:1px solid var(--line);border-radius:36px;box-shadow:0 50px 120px #000c;overflow:hidden;background:rgba(9,13,26,.9)}}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;gap:11px;align-items:center}
.bt b{font-size:.95rem;display:block;color:var(--gold)}
.bt small{color:var(--muted);font-size:.72rem}
.hrow{display:flex;gap:8px;align-items:center;flex:none}
.st{display:flex;align-items:center;gap:5px;font-size:.62rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.st.net{color:#a8d8a0;border-color:#8fce7a55}
.pchip{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.pchip:active{transform:scale(.95)}
.pchip.on{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#5a6785;flex:none}
.dot.on{background:#8fce7a;box-shadow:0 0 0 0 #8fce7a88;animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px #8fce7a00}100%{box-shadow:0 0 0 0 #8fce7a00}}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#main::-webkit-scrollbar{width:4px}#main::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px}
.card h3{font-family:'Marhey';font-size:1rem;font-weight:600;margin-bottom:8px}
.hint{color:var(--muted);font-size:.78rem;line-height:1.7}
.scene-card{background:#05070f;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:13px}
.scene{display:block;width:100%;height:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 20px;font-size:.92rem;font-weight:600;transition:transform .15s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--gold);color:#241a08;box-shadow:0 8px 24px #f0c27426}
.btn.ghost{border:1px solid var(--line2);color:var(--gold)}
.btn.wide{width:100%}
.btn.sq{width:46px;height:46px;padding:0;flex:none}
.btn svg{width:20px;height:20px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);transition:.2s;font-size:.66rem;color:var(--muted)}
.mood i{font-style:normal;font-size:1.35rem}
.mood:active{transform:scale(.92)}
.mood.on{border-color:var(--gold);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.presence{display:flex;gap:12px;align-items:center}
.presence b{font-size:.88rem}
.presence small{color:var(--muted);display:block;font-size:.74rem;margin-top:2px}
.tinies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiny{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 4px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;transition:.15s;font-size:.68rem;color:var(--muted)}
.tiny i{font-style:normal;font-size:1.4rem}
.tiny:active{transform:scale(.9);border-color:var(--gold)}
#tabs{display:flex;background:#0a101f;border-top:1px solid var(--line);padding:8px 10px calc(9px + env(safe-area-inset-bottom));flex:none}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#5f6c8d;font-size:.66rem;padding:5px 0;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--gold)}
#tabs button.on::after{content:'';position:absolute;bottom:-8px;width:16px;height:2.5px;border-radius:3px;background:var(--gold)}
#tabs .badge{position:absolute;top:-1px;inset-inline-start:calc(50% + 4px);width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;transition:.3s}
#tabs .badge.on{opacity:1;animation:ping 2s infinite}
.duo{display:flex;justify-content:space-between;color:var(--muted);font-size:.72rem;margin:-6px 4px 12px}
#main.view-chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
.chat-scroll{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.msg{display:flex;flex-direction:column;max-width:82%;animation:m-in .35s cubic-bezier(.2,1.1,.4,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(10px)}}
.msg.you{align-self:flex-start;align-items:flex-start}
.msg.him{align-self:flex-end;align-items:flex-end}
.bub{background:var(--panel2);border:1px solid var(--line2);border-radius:18px 18px 18px 5px;padding:9px 14px;font-size:.88rem;line-height:1.8}
.msg.you .bub{background:#f0c2741f;border-color:#f0c27459;border-radius:18px 18px 5px 18px}
.msg time{font-size:.62rem;color:#5f6c8d;margin:4px 6px 0}
.tag{display:block;font-size:.7rem;color:var(--gold);margin-top:5px;border-top:1px dashed #f0c27433;padding-top:4px}
.tag.fail{color:var(--rose)}
.msg .tools{display:flex;gap:6px;margin-top:4px}
.msg .tools button{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:3px 9px;background:var(--panel)}
.msg .tools button:active{color:var(--gold);border-color:var(--gold)}
.bub.voice{direction:ltr;min-width:225px;text-align:right}
.bub.voice audio{width:100%;height:38px;outline:none}
.bub.voice small{display:block;color:var(--muted);font-size:.68rem;margin-top:5px;direction:rtl}
.nw{background:#e88a8a14;border:1px solid #e88a8a55;border-radius:18px 18px 5px 18px;padding:10px 16px;text-align:center}
.nw i{font-style:normal;font-size:1.5rem;display:block;margin-bottom:3px}
.nw small{color:var(--muted);font-size:.68rem}
.sec{background:#f3c3cd14;border:1px solid #f3c3cd66;border-radius:18px 18px 5px 18px;padding:11px 15px}
.sec b{color:var(--rose);font-size:.78rem;display:block;margin-bottom:5px}
.dots{display:flex;gap:5px;padding:4px 8px}
.dots .d{width:7px;height:7px;border-radius:50%;background:#8b98b8;animation:jump 1s infinite}
.dots .d:nth-child(2){animation-delay:.15s}.dots .d:nth-child(3){animation-delay:.3s}
@keyframes jump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.composer{flex:none;border-top:1px solid var(--line);background:#0a101f;padding:9px 12px calc(10px + env(safe-area-inset-bottom))}
.nowords{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.nowords::-webkit-scrollbar{display:none}
.nw-btn{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:.72rem;color:var(--muted);transition:.15s;white-space:nowrap}
.nw-btn i{font-style:normal;font-size:1rem}
.nw-btn:active{transform:scale(.93);border-color:var(--rose);color:var(--ink)}
.tagsel{display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.tagchip{font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px}
.tagchip.on{border-color:var(--gold);color:var(--gold);background:#f0c27412}
.inrow{display:flex;gap:9px;align-items:center}
#chat-in{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:11px 15px;font-size:.9rem;outline:none}
#chat-in:focus{border-color:var(--gold)}
.mic{width:46px;height:46px;border-radius:14px;border:1px solid var(--line2);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex:none;transition:.15s}
.mic:active{transform:scale(.9)}
.mic.rec{border-color:#e88a8a;color:#e88a8a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.recbar{flex:1;display:flex;align-items:center;gap:9px;background:#e88a8a14;border:1px solid #e88a8a66;border-radius:14px;padding:11px 15px;font-size:.82rem;color:#e88a8a}
.recdot{width:10px;height:10px;border-radius:50%;background:#e88a8a;flex:none;animation:blink 1s infinite}
.bar{height:9px;background:#0a1120;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .7s cubic-bezier(.3,1,.3,1)}
.bl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.bl b{font-size:.9rem}.bl span{font-size:.72rem;color:var(--gold)}
.threadbox{display:flex;align-items:center;gap:11px}
.threadbox .sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 12px 2px currentColor}
.growth{display:flex;flex-wrap:wrap;gap:7px}
.growth span{font-size:.7rem;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:#5f6c8d}
.growth span.on{border-color:var(--gold);color:var(--gold);background:#f0c27410}
.dream{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:11px 13px;margin-top:8px}
.dream b{font-size:.85rem;display:block}
.dream small{color:var(--muted);font-size:.7rem;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.dream .go{margin-inline-start:auto;flex:none}
.jr{display:flex;gap:12px;position:relative;padding-bottom:16px}
.jr::before{content:'';position:absolute;inset-inline-start:15px;top:34px;bottom:0;width:1.5px;background:repeating-linear-gradient(#f0c27466 0 4px,transparent 4px 9px)}
.jr:last-child::before{display:none}
.jr-ic{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.95rem;flex:none}
.jr b{font-size:.85rem;font-weight:500;display:block}
.jr time{font-size:.66rem;color:#5f6c8d}
.sfl{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sfl:last-of-type{border:none}
.sfl .fl{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--panel2);border:1px solid var(--line);flex:none}
.sfl.open .fl{border-color:var(--rose);background:#e88a8a18}
.sfl b{font-size:.82rem;display:block}
.sfl small{color:var(--muted);font-size:.7rem}
.sfl .pr{margin-inline-start:auto;font-size:.7rem;color:var(--gold);flex:none}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:90;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;gap:11px;align-items:center;background:#101a30f5;border:1px solid #2a3a5e;border-radius:15px;padding:11px 15px;box-shadow:0 14px 34px #000b;animation:tin .5s cubic-bezier(.2,1.2,.4,1) both;font-size:.82rem;line-height:1.6}
.toast i{font-style:normal;font-size:1.3rem;flex:none}
.toast.out{animation:tout .4s both}
@keyframes tin{from{transform:translateY(-18px);opacity:0}}
@keyframes tout{to{transform:translateY(-12px);opacity:0}}
#modals:empty{display:none}
#modals{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:#04060cd9;backdrop-filter:blur(7px)}
.sheet{background:#0d1526;border:1px solid #26355a;border-radius:26px 26px 0 0;padding:24px 20px 34px;width:min(100%,460px);max-height:88dvh;overflow-y:auto;animation:up .5s cubic-bezier(.2,1.1,.3,1) both;scrollbar-width:thin}
@media(min-width:560px){#modals{align-items:center}.sheet{border-radius:26px;margin:auto 26px}}
@keyframes up{from{transform:translateY(70px);opacity:0}}
.sheet h3{font-family:'Marhey';font-size:1.15rem;margin-bottom:6px}
.sheet textarea,.sheet input[type=text],.sheet input[type=date],.sheet select{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;font-size:.9rem;outline:none;margin:8px 0 14px;line-height:1.8;resize:vertical;color:var(--ink)}
.sheet textarea:focus,.sheet input:focus,.sheet select:focus{border-color:var(--gold)}
.sheet label{font-size:.76rem;color:var(--muted)}
.colors{display:flex;gap:13px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.csw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;transition:.2s}
.csw:active{transform:scale(.85)}
.csw.sel{border-color:#fff}
.syncbox{text-align:center}
.syncbox .big{font-size:3.4rem;display:block;margin-bottom:4px}
.sync-status{display:flex;justify-content:center;gap:10px;margin:14px 0;font-size:.8rem;flex-wrap:wrap}
.sync-status span{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:7px 14px;color:var(--muted)}
.sync-status span.ok{border-color:#8fce7a;color:#a8d8a0}
.touchpad{width:170px;height:170px;margin:20px auto;border-radius:50%;border:2px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.82rem;transition:.25s;touch-action:none;user-select:none}
.touchpad.hold{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 40px #f0c27422,0 0 30px #f0c27422;transform:scale(.96)}
.guessrow{display:flex;justify-content:center;gap:12px;margin:18px 0;flex-wrap:wrap}
.gbtn{width:62px;height:62px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:1.6rem;transition:.15s}
.gbtn:active{transform:scale(.88);border-color:var(--gold)}
.result{font-size:2.6rem;animation:popIn .6s cubic-bezier(.2,1.4,.4,1) both;display:block}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.shoot{position:absolute;width:90px;height:2px;background:linear-gradient(90deg,transparent,#ffd98a);animation:shoot 1.25s ease-out both}
@keyframes shoot{from{transform:translate(0,0) rotate(-24deg);opacity:1}to{transform:translate(340px,-170px) rotate(-24deg);opacity:0}}
.moonburst{position:absolute;left:50%;top:38%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#f3ecd8;box-shadow:0 0 44px 20px #ffe9b066;animation:burst 2.1s ease-out both}
@keyframes burst{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(10);opacity:0}}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#splash.bye{opacity:0;pointer-events:none}
#splash .in{text-align:center;animation:tin 1s .2s both}
#splash h1{font-size:1.7rem;color:var(--gold);margin-top:22px}
#splash small{color:var(--muted);letter-spacing:.5em;font-size:.8rem;display:block;margin-top:8px}
#onboard{position:fixed;inset:0;z-index:60;overflow-y:auto;background:var(--bg);padding:40px 24px}
.ob-wrap{max-width:400px;margin:auto;text-align:center}
.ob-wrap h1{font-size:1.8rem;color:var(--gold);margin:20px 0 8px}
.ob-wrap>p{color:var(--muted);font-size:.85rem;line-height:2;margin-bottom:26px}
.ob-form{text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}
.ob-form input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:13px;padding:12px 14px;font-size:.92rem;outline:none;margin:5px 0 12px}
.ob-form input:focus{border-color:var(--gold)}
.ob-form label{font-size:.74rem;color:var(--muted)}
.err{color:#e88a8a;font-size:.74rem;min-height:1.2em;margin-bottom:6px}
.ob-btns{display:flex;flex-direction:column;gap:11px}
.codebox{font-family:'Marhey';font-size:1.9rem;letter-spacing:.35em;color:var(--gold);background:var(--panel2);border:1px dashed var(--gold);border-radius:18px;padding:18px 10px;text-align:center;margin:14px 0;direction:ltr}
.picknames{display:flex;gap:10px;justify-content:center;margin:16px 0}
.pname{flex:1;max-width:160px;padding:16px 8px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);font-size:.95rem}
.pname:active{transform:scale(.95)}
.ob-back{display:block;margin:16px auto 0;color:var(--muted);font-size:.78rem}
.rulesbox{direction:ltr;text-align:left;font-family:monospace;font-size:.66rem;background:var(--panel2);border:1px dashed var(--line2);border-radius:12px;padding:10px;white-space:pre-wrap;color:var(--muted);margin:8px 0 12px;user-select:all}
#invitebar{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);z-index:95;display:flex;align-items:center;gap:10px;background:#1a2440;border:1px solid #3a4c7a;border-radius:16px;padding:10px 12px;box-shadow:0 16px 40px #000b;transition:transform .5s cubic-bezier(.2,1.2,.4,1);max-width:92vw}
#invitebar.in{transform:translate(-50%,0)}
#invitebar i{font-style:normal;font-size:1.3rem;flex:none}
#invitebar span{font-size:.78rem;flex:1}
#invitebar .btn{padding:8px 14px;font-size:.78rem;flex:none}
#invitebar .x{color:var(--muted);font-size:1.1rem;padding:4px;flex:none}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.bigstar{animation:tw 2.2s infinite}
.drop{animation:fall 1s linear infinite}
@keyframes fall{from{transform:translateY(-46px)}to{transform:translateY(400px)}}
.flo{animation:floatUp 7s linear infinite}

function giftMark(g,i){

 switch(g.kind){
  case 'flower':{const c=['#e88a8a','#f0c274','#f2ead8'][i%3];let petals='';for(let a=0;a<5;a++){const ang=a/5*Math.PI*2-Math.PI/2;petals+=`<circle cx="${(Math.cos(ang)*3).toFixed(1)}" cy="${(-11+Math.sin(ang)*3).toFixed(1)}" r="2.1" fill="${c}"/>`}
   return`<g transform="translate(${x},${y})"><g class="${fresh}"><line y2="-9" stroke="#3f6b4a" stroke-width="1.4"/>${petals}<circle cy="-11" r="1.7" fill="#8a5a2a"/></g></g>`}

  case 'heart':return`<g transform="translate(${x},${y})"><g class="flo" style="animation-delay:${(i*1.2).toFixed(1)}s">${heartPath('#e88a8a')}</g></g>`;

  case 'glow':return`<ellipse class="glowpatch ${fresh}" cx="${x}" cy="${y-3}" rx="15" ry="5" fill="#ffd98a" opacity=".22"/>`;

/* ============ توست / مودال / احتفال ============ */
function toast(icon,text){
 const t=document.createElement('div');t.className='toast';t.innerHTML=`<i>${icon}</i><span>${text}</span>`;
 $('#toasts').appendChild(t);
 setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),420)},3400);
}
function openModal(html){$('#modals').innerHTML=`<div class="sheet">${html}</div>`}
function closeModal(){$('#modals').innerHTML=''}
 $('#modals').addEventListener('click',e=>{if(e.target.id==='modals')closeModal()});
function celebrate(){
 const fx=$('#fx');
 fx.innerHTML=Array.from({length:12},()=>`<i class="shoot" style="left:${Math.random()*100}%;top:${Math.random()*65}%;animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`).join('')+`<div class="moonburst"></div>`;
 setTimeout(()=>fx.innerHTML='',2400);
 if(navigator.vibrate)navigator.vibrate(70);
}
function threadPulse(dir){
 if(view!=='world')return;
 const svg=document.querySelector('#main svg.scene');if(!svg)return;
 const d=dir==='out'?'M344 118 Q200 84 56 118':'M56 118 Q200 84 344 118';
 svg.insertAdjacentHTML('beforeend',`<g class="pd"><circle r="4.5" fill="#ffe9b0"><animateMotion dur="1.5s" fill="freeze" path="${d}"/><animate attributeName="opacity" values="1;1;0" dur="1.5s" fill="freeze"/></circle></g>`);
 setTimeout(()=>svg.querySelectorAll('.pd').forEach(g=>g.remove()),1700);
}
const markWorldDirty=()=>$('#badge-world')?.classList.add('on');
const markChat=()=>{if(view!=='chat')$('#badge-chat')?.classList.add('on')};

/* ============ الرحلة / الجسر / النمو ============ */
function firstOrCount(k){S.firsts[k]=(S.firsts[k]||0)+1;return S.firsts[k]===1}
function jlog(icon,title,sub){
 const e={id:'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),icon,title,sub:sub||null,t:Date.now()};
 S.journey.unshift(e);save();
 if(MODE==='net'&&db){try{db.ref(P('journey')).push(e)}catch(err){}}
}
function addGrowthLocal(n){
 const before=S.growth;S.growth+=n;
 const st=STAGE_LIST.find(x=>x.at<=S.growth&&x.at>before);
 if(st){S.lastStage=st.at;S.growthT=Date.now();toast(st.icon,`عالمنا كبر: ${st.label}`);jlog(st.icon,`عالمنا كبر — ${st.label}`);markWorldDirty()}
 save();
}
function txGrowth(n=1){
 if(MODE!=='net'){addGrowthLocal(n);return}
 const before=S.growth;S.growth+=n;
 try{db.ref(P('shared')).transaction(v=>{v=v||{};v.growth=(v.growth||0)+n;return v})}catch(e){}
 const st=STAGE_LIST.find(x=>x.at<=S.growth&&x.at>before);
 if(st){S.lastStage=st.at;S.growthT=Date.now();toast(st.icon,`عالمنا كبر: ${st.label}`);jlog(st.icon,`عالمنا كبر — ${st.label}`);markWorldDirty()}
 save();
}
function txBridge(d){
 S.bridge=Math.max(0,Math.min(100,S.bridge+d));save();
 if(MODE==='net'&&db){try{db.ref(P('shared/bridge')).transaction(v=>Math.max(0,Math.min(100,(v||0)+d)))}catch(e){}}
 if(view==='world')render();
}
function checkRainbow(){
 if(bothSunny()&&firstOrCount('rainbow')){jlog('🌈','اتنينكم مبسوطين — قوس قزح ظهر على الجسر');toast('🌈','قوس قزح ظهر على جسركم!');markWorldDirty();save()}
}

/* ============ أفعالك ============ */
function setMood(k){
 if(S.you.mood===k)return;
 S.you.mood=k;txBridge(2);
 toast(MOODS[k].e,`عالمك اتغيّر: ${MOODS[k].desc}`);
 if(firstOrCount('mood')){jlog('💭','أول مود شكّل عالمكم — '+mL(k,FEM));txGrowth(1)}
 if(MODE==='net')pushMe({mood:k});
 checkRainbow();save();render();
}

/* ============ الرسايل الصوتية 🎙️ ============ */
let recState=null;
function canVoice(){return typeof MediaRecorder!=='undefined'&&navigator.mediaDevices&&!!navigator.mediaDevices.getUserMedia}
async function toggleVoice(){
 if(!canVoice()){toast('🎙️','المتصفح ده مش بيدعم التسجيل الصوتي — جربي كروم');return}
 if(recState){
  clearInterval(recState.timer);
  const st=recState;recState=null;refreshChat();
  try{st.rec.stop()}catch(e){}
  return;
 }
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
 catch(e){toast('🎙️','محتاجين إذن الميكروفون — اسمحي للمتصفح وجرّبي تاني');return}
 let mt='';
 try{if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mt='audio/webm;codecs=opus';else if(MediaRecorder.isTypeSupported('audio/mp4'))mt='audio/mp4';else if(MediaRecorder.isTypeSupported('audio/webm'))mt='audio/webm'}catch(e){}
 let rec;
 try{rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined)}catch(e){stream.getTracks().forEach(t=>t.stop());toast('🎙️','مش قادر يبدأ التسجيل');return}
 const chunks=[];
 const st={rec,stream,chunks,t0:Date.now(),timer:null};
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{
  stream.getTracks().forEach(t=>t.stop());
  const dur=(Date.now()-st.t0)/1000;
  if(dur<0.8||!chunks.length){toast('🎙️','التسجيل قصير أوي');return}
  const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
  const fr=new FileReader();
  fr.onload=()=>{
   const dataURL=fr.result;
   if(dataURL.length>1400000){toast('⚠️','الرسالة طويلة أوي — قصّريها شوية (أقصى حد دقيقة)');return}
   sendMessage({from:'you',kind:'voice',audio:dataURL,dur});
   refreshChat();
   if(MODE==='demo')setTimeout(()=>{showTyping=true;refreshChat();setTimeout(()=>{showTyping=false;pushMsg({from:'him',text:'وصلني صوتك… أحلى حاجة في يومي 🎙️❤️'});refreshChat()},1300)},1600);
  };
  fr.readAsDataURL(blob);
 };
 rec.start();
 st.timer=setInterval(()=>{
  const s=Math.floor((Date.now()-st.t0)/1000);
  if(s>=60){if(recState===st){recState=null;refreshChat()}try{rec.stop()}catch(e){}}
  else{const el=$('#rec-time');if(el)el.textContent=ar(s)+' ثانية'}
 },300);
 recState=st;
 refreshChat();
}

  if(cur>=goal){
   s.opened=true;s.openedAt=Date.now();S.counts.secretsOpened++;
   txBridge(8);txGrowth(1);

function firebase_database_ts(){try{if(typeof firebase!=='undefined'&&firebase.database&&firebase.database.ServerValue)return firebase.database.ServerValue.TIMESTAMP}catch(e){}return Date.now()}
const SVTS=firebase_database_ts();
const seenIds=new Set(),finished=new Set();let seenInvites=new Set();
function netStartChallenge(type){
 const key=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 try{
  db.ref(P('invite')).set({type,from:mySlot,key,t:Date.now()});
  openNetChallenge(type,key);
 }catch(e){toast('⚠️','مش متصلة بالنت')}
}
function watchInvite(){
 db.ref(P('invite')).on('value',s=>{
  const v=s.val();if(!v||v.from===mySlot)return;
  if(Date.now()-v.t>45000)return;
  if(seenInvites.has(v.key))return;seenInvites.add(v.key);
  const bar=$('#invitebar');
  bar.innerHTML=`<i>${({moon:'🌙',color:'🎨',touch:'👆'})[v.type]}</i><span>${esc(S.partner.name)} ${w('بدأت لحظة تزامن! انضمي','بدأ لحظة تزامن! انضم')}</span>

   <button class="x" data-action="invite-no">×</button>`;
  requestAnimationFrame(()=>bar.classList.add('in'));
  clearTimeout(bar._t);bar._t=setTimeout(()=>{bar.classList.remove('in');bar.innerHTML=''},45000);
 });
}
function openNetChallenge(type,key){
 if(type==='moon'){
  openModal(`<div class="syncbox"><span class="big">🌙</span><h3>شوفوا القمر</h3>
  <p class="hint">في نفس اللحظة بالظبط… لما تحسّوا إنكم جاهزين</p>
  <div class="sync-status"><span id="you-st">${w('أنتِ…','أنت…')}</span><span id="him-st">${esc(S.partner.name)}…</span></div>
  <button class="btn primary" data-action="net-ready" data-key="${key}">${w('أنا جاهزة','أنا جاهز')}</button></div>`);
 }else if(type==='color'){
  openModal(`<div class="syncbox"><h3>🎨 اختاروا نفس اللون</h3><p class="hint">اختاروا في نفس الوقت… وشوفوا قلوبكم</p>

 }else{
  openModal(`<div class="syncbox"><h3>👆 لمسة في نفس اللحظة</h3><p class="hint">اضغطوا على الدايرة واستمروا ضاغطين مع بعض</p>
  <div class="touchpad" id="tp"><span>اضغط واستمر</span></div>
  <div class="sync-status"><span id="t-you">${w('أنتِ سايبة','أنت سايب')}</span><span id="t-him">${esc(S.partner.name)} سايب</span></div></div>`);
  netTouch(key);
 }
 netWatch(type,key);
}
function netWatch(type,key){
 db.ref(P(`sync/${key}`)).on('value',s=>{
  const v=s.val()||{};
  if(type==='moon'){
   if(v[mySlot]!=null){const el=$('#you-st');if(el){el.textContent=w('أنتِ جاهزة ✓','أنت جاهز ✓');el.classList.add('ok')}}
   if(v[otherSlot()]!=null){const el=$('#him-st');if(el){el.textContent=`${S.partner.name} جاهز ✓`;el.classList.add('ok')}}
   if(v.A!=null&&v.B!=null){
    const diff=Math.abs(v.A-v.B);
    finishChallenge(key,'🌟',diff<2500,'حصل التزامن!',diff<2500?'في نفس اللحظة بالظبط… ده توقيع قلب واحد ❤️':`كان بينكم ${(diff/1000).toFixed(1)} ثانية بس — وعالمنا كبر برضو 🤍`,'شوفي القمر 🌙',diff<2500);
   }
  }
  if(type==='color'&&v.A&&v.B){
   const same=v.A===v.B;
   if(same){try{db.ref(P('shared/rainbowUntil')).set(Date.now()+30000)}catch(e){}}
   finishChallenge(key,same?'🌈':'🤍',same,'نفس اللون!','قوس قزح لمع على الجسر بينكم 🌈','اختيارين متجاورين — '+CNAMES[v.A],same);
  }
  if(type==='touch')netTouchEval(v,key);
 });
}
function netTouch(key){
 const tp=$('#tp');
 let hold=false;
 tp.addEventListener('pointerdown',e=>{e.preventDefault();hold=true;tp.classList.add('hold');const el=$('#t-you');if(el){el.textContent=w('أنتِ ضاغطة ✓','أنت ضاغط ✓');el.classList.add('ok')}
  try{db.ref(P(`sync/${key}/${mySlot}/s`)).set(SVTS);db.ref(P(`sync/${key}/${mySlot}/e`)).remove()}catch(e){}});
 const up=()=>{if(!hold)return;hold=false;tp.classList.remove('hold');const el=$('#t-you');if(el){el.textContent=w('أنتِ سايبة','أنت سايب');el.classList.remove('ok')}
  try{db.ref(P(`sync/${key}/${mySlot}/e`)).set(SVTS)}catch(e){}};
 tp.addEventListener('pointerup',up);tp.addEventListener('pointerleave',up);tp.addEventListener('pointercancel',up);
}
function netTouchEval(v,key){
 const A=v.A||{},B=v.B||{};
 if(A.s==null||B.s==null)return;
 const end=Math.min(A.e??Date.now(),B.e??Date.now());
 const ov=end-Math.max(A.s,B.s);
 if(ov>=800){finishChallenge(key,'🤍',true,'لمستوا نفس اللحظة!','المساتكم مشيت على الجسر في نفس الثانية ❤️','لمسة واحدة في نفس اللحظة',true)}
 else if(A.e!=null&&B.e!=null&&!finished.has(key)){
  finished.add(key);
  openModal(`<div class="syncbox"><span class="big">🤍</span><h3>قربتوا!</h3><p class="hint">جربوا تاني… المرة الجاية هتلمسوا نفس اللحظة</p><button class="btn primary" data-action="modal-close">تمام</button></div>`);
 }
}
function finishChallenge(key,icon,big,heading,sub,detail,bigReward){
 if(finished.has(key))return;finished.add(key);
 openModal(`<div class="syncbox"><span class="big">${icon}</span><h3>${heading}</h3><p style="color:var(--gold);margin:8px 0">${sub}</p><p class="hint">الجسر نوّر… وعالمنا كبر شوية</p></div>`);
 celebrate();S.counts.sync++;save();
 try{db.ref(P(`sync/${key}/done`)).transaction(cur=>cur===true?undefined:true).then(r=>{
  if(r.committed){
   txBridge(bigReward?10:7);txGrowth(1);
   if(firstOrCount('sync'))jlog('✨','أول لحظة تزامن حقيقية بينكم');
   jlog('✨','لحظة تزامن',detail);
  }
 }).catch(()=>{});
  db.ref(P('invite')).remove();}catch(e){}
 markWorldDirty();
}

function pushMe(extra){
 if(MODE!=='net'||!db)return;
 try{db.ref(P(`users/${mySlot}`)).update(Object.assign({name:S.you.name,mood:S.you.mood,fem:FEM,online:true,lastSeen:Date.now(),activity:S.you.activity},extra||{}))}catch(e){}
}
function bindUniverse(){
 const o=otherSlot();
 S.chat.forEach(m=>seenIds.add(m.id));
 S.journey.forEach(j=>seenIds.add(j.id));
 db.ref(P(`users/${mySlot}`)).once('value').then(s=>{const v=s.val()||{};if(v.name)S.you.name=v.name;if(v.mood)S.you.mood=v.mood;save();renderIfSafe()}).catch(()=>{});
 let firstP=true,lastSig='';
 db.ref(P(`users/${o}`)).on('value',s=>{
  const v=s.val();if(!v)return;
  S.partner.name=v.name||S.partner.name;
  S.partner.mood=v.mood||S.partner.mood;
  S.partner.activity=v.activity||'…';
  S.partner.online=!!v.online&&(Date.now()-(v.lastSeen||0)<80000);
  const sig=[S.partner.name,S.partner.mood,S.partner.online,S.partner.activity].join('|');
  if(firstP){firstP=false;lastSig=sig;renderIfSafe();return}
  if(sig!==lastSig){
   const moodChanged=lastSig.split('|')[1]!==S.partner.mood;
   lastSig=sig;save();
   if(moodChanged){
    if(view!=='partner')toast(MOODS[S.partner.mood].e,`${S.partner.name} ${mL(S.partner.mood,PARTNER_FEM())} — ${MOODS[S.partner.mood].desc}`);
    checkRainbow();
   }
   renderIfSafe();
  }
 });
 db.ref(P('shared')).on('value',s=>{
  const v=s.val();if(!v)return;
  let changed=false;
  if(typeof v.bridge==='number'&&v.bridge!==S.bridge){S.bridge=v.bridge;changed=true}
  if(typeof v.growth==='number'){
   const before=S.growth;S.growth=v.growth;
   const st=STAGE_LIST.find(x=>x.at<=v.growth&&x.at>before);
   if(st){S.lastStage=st.at;S.growthT=v.growthT||Date.now();markWorldDirty();changed=true}
  }
  if(v.firstDay&&Math.abs(v.firstDay-S.firstDay)>5000){S.firstDay=v.firstDay;changed=true}
  if(v.rainbowUntil&&v.rainbowUntil>Date.now()){S.tempRainbow=v.rainbowUntil;changed=true}
  save();if(changed&&view==='world')render();else if(changed)renderHeader();
 });
 /* الرسايل — نص وصوت، بتوصل فورًا للطرفين */
 db.ref(P('chat')).on('child_added',s=>{
  const m=s.val();if(!m)return;
  if(seenIds.has(m.id)){
   const loc=S.chat.find(x=>x.id===m.id);
   if(loc&&m.audio&&!loc.audio){loc.audio=m.audio;loc.dur=m.dur;save();if(view==='chat')refreshChat()}
   return;
  }
  seenIds.add(m.id);
  m.from=m.from===mySlot?'you':'him';
  S.chat.push(m);S.counts.msgs++;
  if(m.from==='him'){
   markChat();
   if(m.kind==='voice')toast('🎙️',`${S.partner.name} بعتلك رسالة صوتية`);
   else toast('💬',`${S.partner.name} كتبلك`);
   if(m.kind==='secret')toast('🌸',`${S.partner.name} فتحلك سرًا من حديقته`);
   refreshChat();
  }else refreshChat();
  save();
 });
 db.ref(P(`gifts/${mySlot}`)).on('child_added',s=>{
  const g=s.val();if(!g||seenIds.has(g.gid))return;seenIds.add(g.gid);
  S.giftsYou.push({kind:g.kind,t:g.t||Date.now()});
  S.lastTinyIn={icon:giftIcon(g.kind),text:g.note||'هدية صغيرة',t:g.t||Date.now()};
  txBridge(2);
  toast(giftIcon(g.kind),`${S.partner.name} بعتلك: "${g.note}" — ظهرت في عالمك`);
  if(firstOrCount('giftin'))jlog('🎁',`أول هدية من ${S.partner.name} تزرع في عالمك: ${giftIcon(g.kind)}`);
  threadPulse('in');markWorldDirty();save();renderIfSafe();
 });
 db.ref(P('journey')).on('child_added',s=>{const e=s.val();if(!e||!e.id||seenIds.has(e.id))return;seenIds.add(e.id);S.journey.unshift(e);save();if(view==='world')render()});
 db.ref(P('dreams')).on('child_added',s=>{const d=s.val();if(!d||seenIds.has(d.id))return;seenIds.add(d.id);d.key=s.key;S.dreams.push(d);save();if(view==='world')render()});
 db.ref(P('dreams')).on('child_changed',s=>{const d=s.val();const i=S.dreams.findIndex(x=>x.id===d.id);if(i>-1){S.dreams[i].done=d.done;if(d.done&&!S.dreams[i].notified){S.dreams[i].notified=true;toast('⭐',`حلمكم اتحقق: ${d.name}`);celebrate()}}save();if(view==='world')render()});
 watchInvite();
 db.ref('.info/connected').on('value',s=>{
  netOnline=!!s.val();renderHeader();
  if(netOnline){
   const me=db.ref(P(`users/${mySlot}`));
   me.onDisconnect().update({online:false,lastSeen:Date.now()}).then(()=>pushMe()).catch(()=>{});
  }
 });
}
const giftIcon=k=>({flower:'🌸',sun:'☀️',hug:'🫂',letter:'💌',star:'⭐',song:'🎵',heart:'❤️',notes:'🎵',sunpop:'☀️',glow:'✨'})[k]||'🎁';

}

function parseCfg(txt){
 if(!txt)return null;
 const m=txt.match(/\{[\s\S]*\}/);if(!m)return null;
 const body=m[0].replace(/,\s*\}/g,'}');
 try{const o=JSON.parse(body);if(o&&o.apiKey)return o}catch(e){}
 const out={};const re=/["']?([A-Za-z_$][\w$]*)["']?\s*:\s*["']([^"']+)["']/g;let r;
 while((r=re.exec(body)))out[r[1]]=r[2];
 return out.apiKey?out:null;
}
function pSaveCfg(){
 const cfg=parseCfg($('#p-cfg').value);
 if(!cfg){$('#p-err').textContent='مش لاقي الإعدادات — الصقي البلوكة اللي فيها apiKey و databaseURL زي ما هي';return}
 if(!cfg.databaseURL||!/^https:\/\//.test(cfg.databaseURL)){$('#p-err').textContent='ناقص databaseURL — لازم تعملي Realtime Database (مش Firestore) وتاخدي الكود منه';return}
 localStorage.setItem('fbcfg',JSON.stringify({apiKey:cfg.apiKey,authDomain:cfg.authDomain||(cfg.projectId?cfg.projectId+'.firebaseapp.com':''),databaseURL:cfg.databaseURL,projectId:cfg.projectId||''}));
 toast('✅','الإعدادات اتحفظت! جاري التفعيل…');
 setTimeout(()=>location.reload(),900);
}

async function pPick(slot){
 const{code,names,firstDay}=window._joinMeta;
 try{
  const us=await db.ref(`unis/${code}/users/${slot}`).once('value');const v=us.val()||{};
  if(v.owner&&v.owner!==deviceId&&Date.now()-(v.lastSeen||0)<2*864e5){$('#p-err').textContent='الاسم ده شغال على موبايل تاني';return}
  await db.ref(`unis/${code}/users/${slot}`).update({owner:deviceId,online:true,lastSeen:Date.now()});
 }catch(e){$('#p-err').textContent='حصلت مشكلة… جرب تاني';return}
 localStorage.setItem('pairCode',code);localStorage.setItem('mySlot',slot);
 S.setup=true;S.you.name=names[slot]||'';S.partner.name=names[slot==='A'?'B':'A']||'';S.firstDay=firstDay;save();
 toast('🌌','جاري الدخول لعالمكم…');
 setTimeout(()=>location.reload(),800);
}
function copyCode(c){
 c=c||CODE;if(!c)return;
 if(navigator.clipboard)navigator.clipboard.writeText(c).then(()=>toast('📋','الكود اتنسخ: '+c)).catch(()=>toast('🌙','انسخيه يدوي: '+c));
 else toast('🌙','انسخيه يدوي: '+c);
}
function unlink(){
 localStorage.removeItem('pairCode');localStorage.removeItem('mySlot');
 toast('👋','تم فك الربط — رجوع للوضع التجريبي');
 setTimeout(()=>location.reload(),800);
}

});

/* ============ PWA ============ */
function roundRectPath(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function star4C(x,cx,cy,s){x.beginPath();x.moveTo(cx,cy-s);x.lineTo(cx+s*.28,cy-s*.28);x.lineTo(cx+s,cy);x.lineTo(cx+s*.28,cy+s*.28);x.lineTo(cx,cy+s);x.lineTo(cx-s*.28,cy+s*.28);x.lineTo(cx-s,cy);x.lineTo(cx-s*.28,cy-s*.28);x.closePath();x.fill()}
function buildPWA(){
 try{
  const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  roundRectPath(x,0,0,512,512,118);x.fillStyle='#070b16';x.fill();
  x.globalAlpha=.07;x.fillStyle='#f0c274';x.beginPath();x.arc(256,256,150,0,7);x.fill();x.globalAlpha=1;
  x.fillStyle='#f0c274';x.beginPath();x.arc(256,256,128,0,7);x.fill();
  x.fillStyle='#070b16';x.beginPath();x.arc(192,250,104,0,7);x.fill();
  x.fillStyle='#f2ead8';[[112,132,7],[424,252,5]].forEach(([sx,sy,r])=>{x.beginPath();x.arc(sx,sy,r,0,7);x.fill()});
  x.fillStyle='#f0c274';[[398,118,6],[98,316,5]].forEach(([sx,sy,r])=>{x.beginPath();x.arc(sx,sy,r,0,7);x.fill()});
  star4C(x,196,224,22);
  const icon=c.toDataURL('image/png');
  const man={name:'OUR UNIVERSE — عالمنا',short_name:'OUR UNIVERSE',description:'عالمين… وجسر واحد بينهم',
   start_url:location.href,scope:location.href,display:'standalone',orientation:'portrait',
   background_color:'#070b16',theme_color:'#070b16',
   icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'},{src:icon,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  $('#manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
 }catch(e){}
}

/* ============ الإقلاع ============ */
buildPWA();
async function boot(){
 window.__uniBooted=true;
 if(netAvailable()&&netInit()){
  const code=localStorage.getItem('pairCode'),slot=localStorage.getItem('mySlot');
  if(code&&slot){
   try{
    const snap=await db.ref(`unis/${code}/meta`).once('value');
    if(snap.exists()){CODE=code;mySlot=slot;FEM=slot==='A';enterApp();return}
   }catch(e){}
   localStorage.removeItem('pairCode');localStorage.removeItem('mySlot');
  }
  showNetOnboard();
 }else{
  if(S.setup)enterApp();else showDemoOnboard();
 }
}
setTimeout(()=>{
 const sp=$('#splash');sp.classList.add('bye');
 setTimeout(()=>sp.remove(),700);
 boot();
},2000);
function partnerTick(){
 if(MODE!=='demo'||!S.setup)return;
 const r=Math.random();
 if(r<.2){
  const prev=S.partner.mood;
  S.partner.mood=pick(['happy','happy','loving','loving','excited','peaceful','peaceful','emotional','drained','annoyed','overwhelmed']);
  if(S.partner.mood!==prev){
   renderIfSafe();
   if(MOODS[S.partner.mood].fam==='cold'&&Math.random()<.5)toast(MOODS[S.partner.mood].e,`${S.partner.name} ${mL(S.partner.mood,false)} — ${MOODS[S.partner.mood].desc}`);
   checkRainbow();save();
  }
 }else if(r<.42){
  S.partner.online=!S.partner.online;S.partner.activity=pick(ACT_M);
  renderIfSafe();save();
 }else if(r<.58&&S.partner.online){partnerSendsTiny()}
}
setTimeout(partnerTick,9000);
setInterval(partnerTick,17000);
setInterval(()=>{if(MODE==='net'&&netOnline)pushMe({lastSeen:Date.now()})},25000);
setInterval(()=>{
 if(!S.setup)return;
 if(MODE==='net'){if(netOnline){try{db.ref(P('shared/bridge')).transaction(v=>v>20?v-1:v)}catch(e){}}}
 else if(S.bridge>20){S.bridge-=1;save();if(view==='world')render()}
},120000);
</script>
