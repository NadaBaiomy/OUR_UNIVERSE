*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070b16;--pn:#0e1626;--pn2:#141f36;--ln:#233253;--ink:#f2ead8;--mu:#8b98b8;--gold:#f0c274;--rose:#e88a8a}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Alexandria',sans-serif;overflow:hidden;background-image:radial-gradient(1.4px 1.4px at 12% 22%,rgba(255,255,255,.2),transparent),radial-gradient(1px 1px at 78% 12%,rgba(255,255,255,.16),transparent),radial-gradient(1.6px 1.6px at 90% 74%,rgba(255,255,255,.13),transparent),radial-gradient(1px 1px at 35% 82%,rgba(255,255,255,.1),transparent)}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;color:var(--ink)}
.en{font-family:'Marhey',cursive;letter-spacing:.12em}
#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:rgba(7,11,22,.75)}

.brand b{font-size:.9rem;color:var(--gold);display:block}

.dot{width:8px;height:8px;border-radius:50%;background:#5a6785;flex:none}
.dot.on{background:#8fce7a;animation:ping 2s infinite}

#main{flex:1;overflow-y:auto;padding:14px 16px 24px}

.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:13px;border:1px solid var(--ln);background:var(--pn2);font-size:.64rem;color:var(--mu)}
.mood i{font-style:normal;font-size:1.3rem}
.mood.on{border-color:var(--gold);color:var(--ink)}
.tinies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiny{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;background:var(--pn2);border:1px solid var(--ln);border-radius:13px;font-size:.66rem;color:var(--mu)}
.tiny i{font-style:normal;font-size:1.3rem}
#tabs{display:flex;background:#0a101f;border-top:1px solid var(--ln);padding:8px 6px calc(9px + env(safe-area-inset-bottom));flex:none}
#tabs button{flex:1;color:#5f6c8d;font-size:.68rem;padding:6px 0;position:relative}

.badge{position:absolute;top:0;right:24%;width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0;font-style:normal}

#splash .in{text-align:center;animation:tin 1s .2s both}

.flo{animation:flo 6s linear infinite}

.lan{animation:pg 3.2s infinite}

.breathe{animation:brz 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

.zzz circle{animation:flo 3.4s linear infinite}
.thread{animation:dm 2.4s linear infinite}

.popin{animation:pi .7s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}

if(rec){clearInterval(rec.tm);const s=rec;rec=null;rc();try{s.r.stop()}catch(e){}return}
let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('🎙️','اسمح للميكروفون وجرّب تاني')}
let mt='';try{for(const t of['audio/mp4','audio/webm;codecs=opus','audio/webm'])if(MediaRecorder.isTypeSupported(t)){mt=t;break}}catch(e){}
let r;try{r=new MediaRecorder(st,mt?{mimeType:mt}:undefined)}catch(e){st.getTracks().forEach(t=>t.stop());return toast('🎙️','مش قادر يبدأ التسجيل')}
const ch=[];r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
const s={r,t0:Date.now(),tm:null};rec=s;
r.onstop=()=>{st.getTracks().forEach(t=>t.stop());const d=(Date.now()-s.t0)/1000;
if(d<.8||!ch.length)return toast('🎙️','التسجيل قصير أوي');
const fr=new FileReader();fr.onload=()=>{const u=fr.result;
if(u.length>1400000)return toast('⚠️','الرسالة طويلة — أقصى حد دقيقة');
send({from:'you',kind:'voice',audio:u,dur:d});
if(MODE==='demo')setTimeout(()=>fake('وصلني صوتك… أحلى حاجة في يومي 🎙️❤️'),2000)};
fr.readAsDataURL(new Blob(ch,{type:r.mimeType||'audio/webm'}))};
r.start();s.tm=setInterval(()=>{const e=Math.floor((Date.now()-s.t0)/1000);
if(e>=60){if(rec===s){rec=null;rc()}try{r.stop()}catch(x){}}
else{const el=$('#rt');if(el)el.textContent=e+' ث'}},400);
rc()}

function shareLink(code){let u=location.href.split('#')[0];const p=[];const c=localStorage.getItem('fbcfg');
if(c){try{p.push('fb='+btoa(unescape(encodeURIComponent(c))))}catch(e){}}
if(code)p.push('code='+code);return u+(p.length?'#'+p.join('&'):'')}
function unlink(){
if(!confirm('تفصل الربط؟ (الكلام المحلي على موبايلك هيتمسح — اللي عنده هيفضل عنده)'))return;
try{if(db&&CODE){db.ref('unis/'+CODE+'/users/'+mySlot).update({online:false,ls:Date.now()});
db.ref('unis/'+CODE+'/chat').off();db.ref('unis/'+CODE+'/gifts/'+mySlot).off();db.ref('unis/'+CODE+'/shared/bridge').off();db.ref('unis/'+CODE+'/users/'+oslot()).off();db.ref('.info/connected').off()}}catch(e){}
const cfg=localStorage.getItem('fbcfg');
localStorage.removeItem(KEY);localStorage.removeItem('pcode');localStorage.removeItem('pslot');localStorage.removeItem('joincode');localStorage.removeItem('pendjoin');
if(cfg)localStorage.setItem('fbcfg',cfg);
location.reload()}

function joinWelcome(){const c=localStorage.getItem('joincode')||'';const bad=!netOK();
 $('#app').hidden=true;$('#ob').hidden=false;
 $('#ob').innerHTML='<div class="obw">'+logo(84)+'<h1 class="en">OUR UNIVERSE</h1><p>عندك دعوة لكون جديد 🌌<br>كود الكون:</p><div class="codebox">'+esc(c)+'</div>'+
(bad?'<p class="hint" style="color:var(--rose)">⚠️ اللينك وصل ناقص — الإعدادات ماصفتش معاه. ظبطها مرة واحدة من هنا وكمّل:</p><button class="btn p w" data-a="cfg">⚙️ إعدادات Firebase</button>'
:'<p class="hint">اضغط الزر واختار اسمك وهتدخل على طول 🌉</p><button class="btn p w" data-a="pjoin">🔑 دخول للكون</button>')+
'<div style="height:8px"></div><button class="btn g w" style="color:var(--mu)" data-a="skipjoin">مش دلوقتي — افتح التطبيق عادي</button></div>'}

function showOB(){$('#ob').hidden=false;
 $('#ob').innerHTML='<div class="obw">'+logo(84)+'<h1 class="en">OUR UNIVERSE</h1><p>عالمين صغيرين بيحسّوا ببعض من بعيد 🌉<br>اربط الموبايلين وابعتوا لبعض من غير كلام</p><div class="obf"><label>اسمك (هو اللي هيشوفه التاني)</label><input id="obname" maxlength="12" value="'+esc(S.you.name||'')+'" placeholder="اسمك"><div class="err"></div><button class="btn p w" data-a="obpair">🌌 اربط الموبايلين</button><div style="height:8px"></div><button class="btn g w" style="color:var(--mu)" data-a="obdemo">جرّب لوحدك الأول 🧪</button></div></div>'}

document.addEventListener('click',function(e){
const t=e.target;
const g=t.closest?t.closest('[data-go]'):null;
if(g){view=g.dataset.go;rd();return}
const a=t.closest?t.closest('[data-a]'):null;
if(!a)return;
const k=a.dataset.a;
if(k==='copycode')copyCode(a.dataset.c);
else if(k==='copylink'){const l=shareLink(CODE);
if(navigator.share){navigator.share({title:'عالمنا 🌉',text:'افتح اللينك ده من موبايلك وهيدخلك لعالمنا على طول 🌌',url:l}).catch(()=>{})}
else if(navigator.clipboard){navigator.clipboard.writeText(l).then(()=>toast('📤','اللينك الكامل اتنسخ — ابعتيله في واتساب زي ما هو')).catch(()=>toast('⚠️','انسخ اللينك من شريط العنوان'))}
else toast('⚠️','انسخ اللينك من شريط العنوان')}
else if(k==='unlink')unlink();
else if(k==='pair')openPairing();
else if(k==='mood')setMood(a.dataset.k);
else if(k==='tiny')sendTiny(a.dataset.k);
else if(k==='nw')sendNW(a.dataset.k);
else if(k==='tag'){tag=(tag===a.dataset.k)?null:a.dataset.k;rc()}
else if(k==='send')sendText();
else if(k==='voice')voice();
else if(k==='cfg')cfgForm();
else if(k==='savecfg')saveCfg();
else if(k==='pcreate')pCreateForm();
else if(k==='pjoin')pJoinForm();
else if(k==='obpair'){const el=document.getElementById('obname');const n=(el?el.value:'').trim();if(!n)return err('اكتب اسمك الأول 🌙');S.you.name=n;save();$('#ob').hidden=true;openPairing()}
else if(k==='obdemo'){const el=document.getElementById('obname');const n=(el?el.value:'').trim();S.you.name=n||'أنا';S.p2.name=FEM?'هو':'هي';S.setup=true;save();$('#ob').hidden=true;$('#app').hidden=false;render();toast('🧪','وضع تجريبي — الربط الحقيقي متاح من الزر الدهبي في الرئيسية')}
else if(k==='skipjoin'){localStorage.removeItem('pendjoin');$('#ob').hidden=true;if(!S.setup)showOB();else{$('#app').hidden=false;render()}}
else if(k==='reload')location.reload();
else if(k==='pcreatego'||k==='pjoingo'||k==='ppick'){if(window._busy)return;window._busy=true;setTimeout(()=>{window._busy=false},5000);
if(k==='pcreatego')pCreateGo();else if(k==='pjoingo')pJoinGo();else pPick(a.dataset.slot)}
});

async function boot(){window.__ok=true;
const sp=$('#splash');if(sp){sp.classList.add('bye');setTimeout(()=>{if(sp)sp.remove()},700)}
// دعوة معلّقة من لينك جاهز؟ دي أهم حاجة — بتظهر قبل أي حاجة تانية
const jc=localStorage.getItem('joincode');
if(localStorage.getItem('pendjoin')==='1'&&jc&&localStorage.getItem('pcode')!==jc){joinWelcome();return}
try{const pc=localStorage.getItem('pcode'),ps=localStorage.getItem('pslot');
if(S.setup&&pc&&ps&&netOK()){CODE=pc;mySlot=ps;FEM=(mySlot!=='B');
if(!S.you.act)S.you.act=FEM?pick(ACTF):pick(ACTM);
if(initNet()){MODE='net';await waitAuth();bind()}}}catch(e){}
if(!S.setup)showOB();else{$('#app').hidden=false;render()}
if(MODE==='net'){pushMe();setInterval(pushMe,45000)}}
boot();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&MODE==='net')pushMe()});
</script>
