function notifyMe(title,body){

}else if(Notification.permission!=='denied'){
Notification.requestPermission().then(p=>{if(p==='granted'){const n=new Notification(title,{body:body,tag:'uni-sync'});setTimeout(()=>{try{n.close()}catch(e){}},20000)}});
}
}catch(e){}}

function quizCard(){
if(!quiz||!quiz.qs){
return '<p class="hint">٥ أسئلة سريعة عن بعض — كل واحد يجاوب لوحده، وفي الآخر تشوفوا نسبة توافقكم.</p><button class="btn p w" data-a="quizNew">ابدئوا كويز جديد 🧩</button>';}
const me=quiz[mySlot],them=quiz[oslot()];
if(me&&me.done&&them&&them.done){
let m=0;
const rows=quiz.qs.map((qi,i)=>{
const a=me.ans[i],b=them.ans[i];
const match=(a!=null&&a===b);if(match)m++;
return '<div class="qcard"><p class="hint" style="color:var(--ink)">'+QUIZ_QS[qi]+'</p>'
+'<div class="hint">🌸 '+NAMES[mySlot]+': <b style="color:var(--ink)">'+(a===0?NAMES.A:NAMES.B)+'</b></div>'
+'<div class="hint">💙 '+NAMES[oslot()]+': <b style="color:var(--ink)">'+(b===0?NAMES.A:NAMES.B)+'</b></div>'
+(match?'<small style="color:#a8d8a0">✓ متوافقين</small>':'<small style="color:var(--rose)">✗ مختلفين</small>')+'</div>'}).join('');
const pct=Math.round(m/quiz.qs.length*100);
return '<div style="text-align:center;margin-bottom:9px"><b style="font-size:1.7rem;color:var(--gold)">'+pct+'%</b><p class="hint">'+(pct>=80?'قلب واحد فعلًا ❤️':pct>=50?'قريبين ومتفاهمين 🤍':'كل واحد عالمه الجميل 🌙')+'</p></div>'+rows
+'<button class="btn g w" data-a="quizNew" style="margin-top:6px">كويز جديد 🔁</button>';}
if(me&&me.done)return '<p class="hint">خلصتي إجاباتك ✅ — مستنيين '+esc(NAMES[oslot()])+' يخلص عشان تظهر النتيجة.</p>';
const step=Math.min(quizStep,quiz.qs.length-1);

function compressImage(file,cb){

cb(cnv.toDataURL('image/jpeg',.7));
}catch(e){cb(null)}}).catch(()=>cb(null))}

function openChallenge(type,key){
const n=SYNCN[type];
let body='<div class="syncbox"><span class="big">'+n.i+'</span><h3>'+n.t+'</h3><p class="hint">'+n.d+'</p><div class="sync-status"><span id="you-st">'+w('أنتِ…','أنت…')+'</span><span id="him-st">'+esc(S.p2.name||'التاني')+'…</span></div>';
if(type==='moon'){
body+='<button class="btn p" data-a="sready" data-key="'+key+'">'+w('أنا جاهزة','أنا جاهز')+'</button></div>';
}else if(type==='color'){
body+='<div class="colors">'+COLORS.map(c=>'<button class="csw" style="background:'+c+'" data-a="scolor" data-c="'+c+'" data-key="'+key+'"></button>').join('')+'</div><p class="hint" id="color-st">&nbsp;</p></div>';
}else{
body+='<div class="touchpad" id="tp"><span>اضغط واستمر</span></div></div>';
}
modal(body);
if(type==='touch')netTouch(key);
watchChallenge(type,key)}
function watchChallenge(type,key){
db.ref(P('sync/'+key)).on('value',s=>{
const v=s.val()||{};
if(finished.has(key)){return}
if(type==='moon'){
if(v[mySlot]!=null){const el=$('#you-st');if(el){el.textContent=w('أنتِ جاهزة ✓','أنت جاهز ✓');el.classList.add('ok')}}
if(v[oslot()]!=null){const el=$('#him-st');if(el){el.textContent=(S.p2.name||'التاني')+' جاهز ✓';el.classList.add('ok')}}
if(v.A!=null&&v.B!=null){
const diff=Math.abs((v.A||0)-(v.B||0));
const perfect=diff<3000;
finishChallenge(key,'🌟',perfect,'حصل التزامن!',perfect?'في نفس اللحظة بالظبط… توقيع قلب واحد ❤️':'كان بينكم '+(diff/1000).toFixed(1)+' ثانية — وعالمنا كبر برضو 🤍',perfect)}}
if(type==='color'&&v.A&&v.B){
const same=v.A===v.B;
if(same){try{db.ref(P('shared/rainbow')).set(Date.now()+30000)}catch(e){}}
finishChallenge(key,same?'🌈':'🤍',same,'نفس اللون!',same?'قوس قزح لمع على الجسر بينكم 🌈':'قريبين أكتر مما تتخيلوا 🤍',same)}
if(type==='touch'){
const A=v.A||{},B=v.B||{};
if(A.s==null||B.s==null)return;
const end=Math.min(A.e||Date.now(),B.e||Date.now());
const ov=end-Math.max(A.s,B.s);
if(ov>=800){finishChallenge(key,'🤍',true,'لمستوا نفس اللحظة!','المساتكم مشيت على الجسر في نفس الثانية ❤️',true)}
else if(A.e!=null&&B.e!=null&&!finished.has(key)){
finished.add(key);
modal('<div class="syncbox"><span class="big">🤍</span><h3>قربتوا!</h3><p class="hint">جربوا تاني… المرة الجاية هتلمسوا نفس اللحظة</p><button class="btn p" data-a="close">تمام</button></div>');
try{db.ref(P('invite')).remove()}catch(e){}}}
})}
function netTouch(key){
const tp=$('#tp');if(!tp)return;
let hold=false;
tp.addEventListener('pointerdown',e=>{e.preventDefault();hold=true;tp.classList.add('hold');
const el=$('#you-st');if(el){el.textContent=w('أنتِ ضاغطة ✓','أنت ضاغط ✓');el.classList.add('ok')}
try{db.ref(P('sync/'+key+'/'+mySlot+'/s')).set(SVTS());db.ref(P('sync/'+key+'/'+mySlot+'/e')).remove()}catch(e){}});
const up=()=>{if(!hold)return;hold=false;tp.classList.remove('hold');
const el=$('#you-st');if(el){el.textContent=w('أنتِ سايبة','أنت سايب');el.classList.remove('ok')}
try{db.ref(P('sync/'+key+'/'+mySlot+'/e')).set(SVTS())}catch(e){}};
tp.addEventListener('pointerup',up);tp.addEventListener('pointerleave',up);tp.addEventListener('pointercancel',up)}
function finishChallenge(key,icon,perfect,heading,sub,bigReward){
if(finished.has(key))return;finished.add(key);
modal('<div class="syncbox"><span class="big">'+icon+'</span><h3>'+heading+'</h3><p style="color:var(--gold);margin:8px 0">'+sub+'</p><p class="hint">الجسر نوّر واتمدد — وعالمنا كبر 💛</p><button class="btn p" data-a="close">جميل 🤍</button></div>');
celebrate();
S.syncs=(S.syncs||0)+1;save();rd();
try{db.ref(P('sync/'+key+'/done')).transaction(cur=>cur===true?undefined:true).then(r=>{
if(r.committed){bx(perfect?10:7);toast('🌉','الجسر كبر — عالمنا بيكبر بكم')}}).catch(()=>{});
db.ref(P('invite')).remove()}catch(e){}}

function dqSave(){const el=$('#dqin');if(!el)return;const t=el.value.trim();if(!t)return toast('✍️','اكتبي حاجة الأول');
try{db.ref(P('daily/'+todayKey()+'/'+mySlot)).set({text:t,t:Date.now()});toast('💭','اتسجلت — مستنيين '+NAMES[oslot()]);rd()}catch(e){toast('⚠️','مش متصلة بالنت')}}
function quizNew(){
const pool=QUIZ_QS.map((_,i)=>i);const qs=[];
while(qs.length<Math.min(5,QUIZ_QS.length)&&pool.length){qs.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0])}
try{db.ref(P('quiz')).set({qs:qs,A:{ans:[],done:false},B:{ans:[],done:false},t:Date.now()});toast('🧩','كويز جديد — العبوا!')}catch(e){toast('⚠️','مش متصلة بالنت')}}
function quizAns(v){if(!quiz)return;
myQuizAns.push(v);
if(myQuizAns.length>=quiz.qs.length){
try{db.ref(P('quiz/'+mySlot)).set({ans:myQuizAns,done:true});toast('🧩','جاوبتي الكل — مستنيين '+NAMES[oslot()])}catch(e){}}
else{quizStep++;rd()}}
function xoNew(){
try{db.ref(P('xo')).set({b:[0,0,0,0,0,0,0,0,0],t:(xo&&xo.w==='A')?'B':(xo&&xo.w==='B')?'A':'A',w:0,sA:(xo?xo.sA||0:0),sB:(xo?xo.sB||0:0)})}catch(e){toast('⚠️','مش متصلة بالنت')}}
function xoWin(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(const l of L){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return b[l[0]]===1?'A':'B'}return 0}
function xoCell(i){if(!xo||!xo.b)return;
if(xo.w)return;
if(xo.t!==mySlot)return toast('⏳','دور '+NAMES[oslot()]);
if(xo.b[i])return;
const nb=xo.b.slice();nb[i]=mySlot==='A'?1:2;
const wn=xoWin(nb);
const upd={b:nb,t:xo.t==='A'?'B':'A',w:wn||0,sA:xo.sA||0,sB:xo.sB||0};
if(wn==='A')upd.sA++;
if(wn==='B')upd.sB++;
if(!wn&&nb.every(x=>x))upd.w='D';
try{db.ref(P('xo')).set(upd)}catch(e){}}
function bkAdd(){const el=$('#bkin');if(!el)return;const t=el.value.trim();if(!t)return;
try{db.ref(P('bucket')).push({text:t,done:false,by:mySlot,t:Date.now()});el.value='';toast('🌟','اتضافت لقائمتكم')}catch(e){toast('⚠️','مش متصلة بالنت')}}
function bkToggle(id,done){try{db.ref(P('bucket/'+id)).update({done:!done});if(!done){bx(3);toast('⭐','إنجاز جديد مع بعض!')}}catch(e){}}

case 'close':cmodal();break;

case 'retry':location.reload();break}});

function buildPWA(){try{

x.beginPath();x.moveTo(118,0);x.arcTo(512,0,512,512,118);x.arcTo(512,512,0,512,118);x.arcTo(0,512,0,0,118);x.arcTo(0,0,512,0,118);x.closePath();x.fillStyle='#070b16';x.fill();

x.fillStyle='#f2ead8';[[112,132,7],[424,252,5],[398,118,6],[98,316,5]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],p[2],0,7);x.fill()});
x.fillStyle='#f0c274';x.beginPath();x.moveTo(196,202);x.lineTo(202,218);x.lineTo(218,224);x.lineTo(202,230);x.lineTo(196,246);x.lineTo(190,230);x.lineTo(174,224);x.lineTo(190,218);x.closePath();x.fill();

 $('#mf').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}))}catch(e){}}

buildPWA();
